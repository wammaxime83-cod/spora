<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Administration Spora</title>
<style>
:root{--bg:#f6f7fb;--s:#fff;--t:#1a2748;--t2:#5b6685;--b:#e3e6ef;--p:#15357a;--ok:#12a36f;--no:#e5484d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1730;--s:#17213f;--t:#eef1fa;--t2:#9aa6c6;--b:#2a3558;--p:#8db0ff;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t);padding:20px max(16px,env(safe-area-inset-left))}
main{max-width:1100px;margin:auto}h1{font-size:1.6rem;margin:0 0 4px}a{color:var(--p);font-weight:700}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}.st div{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:12px}.st b{font-size:1.5rem;display:block}.st small{color:var(--t2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,select,input{font:inherit;border-radius:10px;border:1px solid var(--b);background:var(--s);color:var(--t);padding:8px 12px}button{cursor:pointer;font-weight:700}button.on{background:var(--p);color:#fff;border-color:var(--p)}
.tw{overflow-x:auto;background:var(--s);border:1px solid var(--b);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--b);vertical-align:top}th{color:var(--t2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--b)}.tag.verifie{background:rgba(18,163,111,.18);color:var(--ok)}.tag.refuse{background:rgba(229,72,77,.15);color:var(--no)}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;font-size:13px;margin:8px 0 0}.msg{padding:12px;border-radius:12px;background:var(--s);border:1px solid var(--b)}
</style></head><body><main>
<h1>Administration Spora</h1><p style="color:var(--t2);margin:0"><a href="/#espace">← Retour au site</a></p>
<div id="app"><p>Chargement…</p></div></main>
<script src="/js/api.js"></script><script src="/js/admin.js"></script></body></html>
